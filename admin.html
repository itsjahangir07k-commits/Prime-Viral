<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>body{background:#111;color:#fff;padding:20px;font-family:sans-serif}input,select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:0}button{width:100%;padding:14px;background:#ff0066;color:#fff;border:0;border-radius:8px;font-weight:bold}</style></head><body><div id="login"><h2>Admin Login</h2><input id="pass" placeholder="Password"><button onclick="if(document.getElementById('pass').value==='JAHANGIR123'){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block'}else alert('Wrong')">Login</button></div><div id="panel" style="display:none"><h2>Add Video</h2><input id="title" placeholder="Title"><input id="thumb" placeholder="Thumbnail Link"><input id="link" placeholder="Video Link"><select id="cat"><option>সব</option><option>ভাইরাল</option><option>বাবা মেয়ে</option></select><button onclick="let v={title:title.value,thumb:thumb.value,link:link.value,cat:cat.value};let a=JSON.parse(localStorage.getItem('prime_videos')||'[]');a.unshift(v);localStorage.setItem('prime_videos',JSON.stringify(a));alert('Added')">Add Video</button></div></body></html>
