<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prime Viral</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div>✓ আমি নিশ্চিত করছি আমার বয়স ১৮+</div>
<div><button>ভাগ্নী</button><button>ভাই বোন</button></div>

<div style="display:flex;gap:10px;margin-top:20px;background:#222;padding:10px;border-radius:10px">
<img id="userPhoto" src="" width="45" height="45" style="border-radius:50%">
<div>
<b id="userName">OWNER JAHANGIR VAI</b>
<p id="userUsername">@JAHANGIR_07K</p>
</div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
const user = tg.initDataUnsafe.user;
if(user){
  document.getElementById('userName').innerText = user.first_name + ' ' + (user.last_name||'');
  document.getElementById('userUsername').innerText = user.username ? '@'+user.username : 'ID:'+user.id;
  if(user.photo_url) document.getElementById('userPhoto').src = user.photo_url;
}
</script>
</body>
</html>
